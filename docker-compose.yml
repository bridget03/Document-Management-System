services:
  postgres:
    # Khớp setup đang chạy thật: postgres:18, user dms_user, db dms, port 5433.
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Hãy đặt POSTGRES_PASSWORD trong file .env ở thư mục gốc (cùng mật khẩu DATABASE_URL của backend)}
      POSTGRES_DB: ${POSTGRES_DB:-dms}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dms_user} -d ${POSTGRES_DB:-dms}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    # Dùng chung start.sh với Render (migration + PORT động, local mặc định 8000).
    command: ./start.sh
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-dms_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dms}
      JWT_SECRET: ${JWT_SECRET:?Hãy đặt JWT_SECRET trong file .env ở thư mục gốc}
      STORAGE_PATH: /data/storage
      CORS_ORIGINS: http://localhost:5173
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/google-drive/callback}
    ports:
      - "8000:8000"
    volumes:
      - document-storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  document-storage:
